<!doctype html>
<html lang="en" data-i18n-doc="optionsTitle">
  <head>
    <meta charset="utf-8" />
    <title>WebSpaces</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="page">
    <div class="shell">
      <aside class="nav">
        <div class="brand">
          <img class="brand-mark" src="../icons/icon48.png" alt="" />
          <span class="brand-text">
            <span class="brand-name">WebSpaces</span>
            <span class="brand-tag" data-i18n="brandTag"></span>
          </span>
        </div>

        <p class="nav-group" data-i18n="navGroupConfig"></p>
        <button class="nav-item" data-section="containers">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M21 8v8a2 2 0 0 1-1 1.73l-7 4a2 2 0 0 1-2 0l-7-4A2 2 0 0 1 3 16V8a2 2 0 0 1 1-1.73l7-4a2 2 0 0 1 2 0l7 4A2 2 0 0 1 21 8z"
            />
            <polyline points="3.3 7 12 12 20.7 7" />
            <line x1="12" y1="22" x2="12" y2="12" />
          </svg>
          <span data-i18n="navContainers"></span>
        </button>
        <button class="nav-item" data-section="rules">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
          </svg>
          <span data-i18n="navRules"></span>
        </button>
        <button class="nav-item" data-section="realms">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <polygon points="12 2 2 7 12 12 22 7 12 2" />
            <polyline points="2 17 12 22 22 17" />
            <polyline points="2 12 12 17 22 12" />
          </svg>
          <span data-i18n="navRealms"></span>
        </button>

        <p class="nav-group" data-i18n="navGroupSystem"></p>
        <button class="nav-item" data-section="other">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <line x1="4" y1="21" x2="4" y2="14" />
            <line x1="4" y1="10" x2="4" y2="3" />
            <line x1="12" y1="21" x2="12" y2="12" />
            <line x1="12" y1="8" x2="12" y2="3" />
            <line x1="20" y1="21" x2="20" y2="16" />
            <line x1="20" y1="12" x2="20" y2="3" />
            <line x1="1" y1="14" x2="7" y2="14" />
            <line x1="9" y1="8" x2="15" y2="8" />
            <line x1="17" y1="16" x2="23" y2="16" />
          </svg>
          <span data-i18n="navBehaviour"></span>
        </button>
        <button class="nav-item" data-section="backup">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <polyline points="23 4 23 10 17 10" />
            <polyline points="1 20 1 14 7 14" />
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
          </svg>
          <span data-i18n="navBackup"></span>
        </button>
        <button class="nav-item" data-section="experimental">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 2v6.5L3.5 19A2 2 0 0 0 5.3 22h13.4a2 2 0 0 0 1.8-3L15 8.5V2" />
            <line x1="8" y1="2" x2="16" y2="2" />
            <line x1="7" y1="15" x2="17" y2="15" />
          </svg>
          <span data-i18n="navExperimental"></span>
        </button>
        <button class="nav-item" data-section="author">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          <span data-i18n="navAuthor"></span>
        </button>

        <div class="nav-foot">
          <span class="brand-name" id="version">WebSpaces</span>
          <span class="brand-tag" data-i18n="navFootTag"></span>
        </div>
      </aside>

      <main class="content">
        <div class="warn" id="status" hidden></div>

        <!-- Containers -->
        <section class="panel" data-panel="containers" hidden>
          <header class="page-head">
            <div>
              <h1 data-i18n="containersTitle"></h1>
              <p class="sub" data-i18n="containersIntro"></p>
            </div>
          </header>

          <div class="stats" id="stats"></div>
          <div id="containers" class="list"></div>

          <div class="card dashed">
            <div class="row">
              <span class="icon-tile plain">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <line x1="12" y1="5" x2="12" y2="19" />
                  <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
              </span>
              <div class="grow">
                <strong data-i18n="addContainerTitle"></strong>
                <p class="sub" data-i18n="addContainerIntro"></p>
              </div>
            </div>
            <div class="row" style="margin-top: 10px">
              <input type="text" id="new-name" data-i18n-ph="phContainerName" />
              <input type="text" id="new-description" class="grow" data-i18n-ph="phContainerDesc" />
              <button class="primary" id="add-container" data-i18n="actionAdd"></button>
            </div>
          </div>
        </section>

        <!-- Rules -->
        <section class="panel" data-panel="rules" hidden>
          <header class="page-head">
            <div>
              <h1 data-i18n="rulesTitle"></h1>
              <p class="sub" data-i18n="rulesIntro"></p>
            </div>
          </header>

          <p class="sub" data-i18n-html="rulesPatterns"></p>
          <div id="rules" class="list"></div>
          <div class="card dashed">
            <div class="row">
              <input type="text" id="new-pattern" class="grow" data-i18n-ph="phPattern" />
              <select id="new-rule-container" style="width: auto"></select>
              <button class="primary" id="add-rule" data-i18n="actionAdd"></button>
            </div>
          </div>
        </section>

        <!-- Realms -->
        <section class="panel" data-panel="realms" hidden>
          <header class="page-head">
            <div>
              <h1 data-i18n="realmsTitle"></h1>
              <p class="sub" data-i18n="realmsIntro"></p>
            </div>
          </header>

          <div class="warn" data-i18n-html="realmsWarn"></div>
          <div id="realms" class="list"></div>
          <div class="card dashed">
            <div class="row">
              <input type="text" id="new-realm" class="grow" data-i18n-ph="phRealmName" />
              <button class="primary" id="add-realm" data-i18n="actionAddRealm"></button>
            </div>
            <div class="row" style="margin-top: 8px">
              <select id="preset-realm" class="grow"></select>
              <button id="add-preset" data-i18n="actionAddPreset"></button>
            </div>
          </div>
        </section>

        <!-- Behaviour -->
        <section class="panel" data-panel="other" hidden>
          <header class="page-head">
            <div>
              <h1 data-i18n="behaviourTitle"></h1>
              <p class="sub" data-i18n="behaviourIntro"></p>
            </div>
          </header>

          <div class="card">
            <label class="check">
              <input type="checkbox" id="auto-mount" />
              <span>
                <span data-i18n="optAutoMount"></span>
                <span class="sub" data-i18n="optAutoMountNote"></span>
              </span>
            </label>
            <label class="check">
              <input type="checkbox" id="show-interstitial" />
              <span>
                <span data-i18n="optInterstitial"></span>
                <span class="sub" data-i18n="optInterstitialNote"></span>
              </span>
            </label>
            <label class="check">
              <input type="checkbox" id="clear-site-data" />
              <span>
                <span data-i18n="optClearData"></span>
                <span class="sub" data-i18n="optClearDataNote"></span>
              </span>
            </label>
          </div>
        </section>

        <!-- Backup and sync -->
        <section class="panel" data-panel="backup" hidden>
          <header class="page-head">
            <div>
              <h1 data-i18n="backupTitle"></h1>
              <p class="sub" data-i18n="backupIntro"></p>
            </div>
          </header>

          <h3 data-i18n="syncHeading"></h3>
          <div class="card">
            <label class="check">
              <input type="checkbox" id="sync-enabled" />
              <span>
                <span data-i18n="optSync"></span>
                <span class="sub" data-i18n="optSyncNote"></span>
              </span>
            </label>
            <div class="row spread">
              <span class="sub" id="sync-state"></span>
              <button id="sync-clear" data-i18n="actionClearShared"></button>
            </div>
          </div>

          <h3 data-i18n="exportHeading"></h3>
          <p class="sub" data-i18n="exportIntro"></p>
          <div class="card">
            <label class="check">
              <input type="checkbox" id="include-cookies" />
              <span>
                <span data-i18n="optCookies"></span>
                <span class="sub" data-i18n="optCookiesNote"></span>
              </span>
            </label>
            <div class="row">
              <button class="primary" id="export" data-i18n="actionExport"></button>
              <button id="import" data-i18n="actionImport"></button>
            </div>
            <label class="check" style="margin-top: 10px">
              <input type="checkbox" id="restore-windows" />
              <span data-i18n="optRestoreWindows"></span>
            </label>
            <input type="file" id="file" accept="application/json,.json" hidden />
          </div>
        </section>

        <!-- Experimental -->
        <section class="panel" data-panel="experimental" hidden>
          <header class="page-head">
            <div>
              <h1 data-i18n="expTitle"></h1>
              <p class="sub" data-i18n="expIntro"></p>
            </div>
          </header>

          <h3 data-i18n="expBookmarksHeading"></h3>
          <p class="sub" data-i18n-html="expBookmarksIntro"></p>
          <div class="card">
            <label class="check">
              <input type="checkbox" id="bookmarks-per-container" />
              <span>
                <span data-i18n="optBookmarks"></span>
                <span class="sub" data-i18n-html="optBookmarksNote"></span>
              </span>
            </label>
            <div class="row">
              <label class="sub" for="orphan-bookmarks" data-i18n="labelOrphan"></label>
              <select id="orphan-bookmarks" style="width: auto">
                <option value="default" data-i18n="orphanDefault"></option>
                <option value="everywhere" data-i18n="orphanEverywhere"></option>
              </select>
            </div>
            <div class="row" style="margin-top: 10px">
              <button id="restore-bookmarks" data-i18n="actionRestoreBookmarks"></button>
            </div>
          </div>

          <div id="bookmark-manager" hidden>
            <h3 data-i18n="ownersHeading"></h3>
            <p class="sub" data-i18n-html="ownersIntro"></p>
            <p class="sub" id="bookmark-bar-state"></p>
            <div class="row">
              <label class="sub" for="bookmark-owner" data-i18n="showBookmarksOf"></label>
              <span class="dot" id="bookmark-owner-dot"></span>
              <select id="bookmark-owner" class="grow"></select>
            </div>
            <div id="bookmark-list" class="list"></div>
          </div>

          <div class="warn" style="margin-top: 12px" data-i18n="expWarn"></div>
        </section>

        <!-- Author -->
        <section class="panel" data-panel="author" hidden>
          <header class="page-head">
            <div>
              <h1 data-i18n="authorTitle"></h1>
              <p class="sub" data-i18n="authorIntro"></p>
            </div>
          </header>

          <div class="card">
            <div class="row">
              <span class="icon-tile plain">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
              </span>
              <div class="grow">
                <strong data-i18n="authorName"></strong>
                <p class="sub" data-i18n="authorNote"></p>
              </div>
            </div>
            <div class="row" style="margin-top: 10px">
              <a class="btn" href="https://jaroslawkrolikowski.pl" target="_blank" rel="noreferrer">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                  <polyline points="15 3 21 3 21 9" />
                  <line x1="10" y1="14" x2="21" y2="3" />
                </svg>
                <span data-i18n="linkSite"></span>
              </a>
              <a
                class="btn"
                href="https://github.com/jaroslaw-krolikowski/WebSpaces"
                target="_blank"
                rel="noreferrer"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                  <polyline points="15 3 21 3 21 9" />
                  <line x1="10" y1="14" x2="21" y2="3" />
                </svg>
                <span data-i18n="linkSource"></span>
              </a>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="options.js"></script>
  </body>
</html>
